name: <%= @args[0] || "rust" %>
root: <%= @args[1] || "~/Development/" %>

startup_window: editor
startup_pane: 0

windows:
  - editor:
      layout: main-vertical
      panes:
        - nvim
        - # shell
  - git:
      panes:
        - lazygit
  - build:
      layout: even-horizontal
      panes:
        - # cargo build
        - cargo watch -x check -x test
  - tests:
      - # cargo test
  - repl:
      - # evcxr or cargo run
