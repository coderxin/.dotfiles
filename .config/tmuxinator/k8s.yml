name: <%= @args[0] || "k8s" %>
root: <%= @args[1] || "~/Development/" %>

startup_window: editor
startup_pane: 0

windows:
  - editor:
      layout: main-vertical
      panes:
        - nvim
        - # shell
  - k9s:
      - k9s
  - kubectl:
      layout: even-horizontal
      panes:
        - kubectl get pods -A
        - # kubectl commands
  - logs:
      - # kubectl logs -f
  - git:
      panes:
        - lazygit
